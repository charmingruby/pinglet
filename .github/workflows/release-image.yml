name: Release Image
on:
  push:
    branches: [main]

jobs:
  release-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container

      - name: Generate tags
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          TAGS="charmingruby/pinglet:latest,charmingruby/pinglet:${SHA}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.generate_tag.outputs.tags }}
          cache-from: type=registry,ref=charmingruby/pinglet:buildcache
          cache-to: type=registry,ref=charmingruby/pinglet:buildcache,mode=max
