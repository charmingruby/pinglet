version: "3"

tasks:
  build:
    desc: Builds API binary
    cmd: go build -ldflags="-s -w" -trimpath -o bin/api ./cmd/api
  test:
    desc: Runs tests
    cmd: go test ./... -race
  lint:
    desc: Runs linter
    cmds:
      - go fmt ./...
      - golangci-lint run ./...
  lint-fix:
    desc: Runs linter with auto-fix
    cmds:
      - go fmt ./...
      - golangci-lint run --fix ./...
